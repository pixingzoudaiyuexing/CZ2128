name = "cz2128"
main = "src/index.ts"
compatibility_date = "2024-03-20"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "cz2128-db"
database_id = "local-dev-only"

[[queues.producers]]
queue = "cz2128-queue"
binding = "QUEUE"

[[queues.consumers]]
queue = "cz2128-queue"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 3
