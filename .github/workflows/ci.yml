name: CI

on:
  push:
    branches:
      - main
      - 'gemini/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx wrangler d1 migrations apply cz2128-db --local
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
